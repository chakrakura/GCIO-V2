<script>
  (function () {
    async function refreshNotes(container, url, section) {
      const join = url.includes('?') ? '&' : '?';
      const resp = await fetch(`${url}${join}home_section=${encodeURIComponent(section)}`, {
        headers: { 'X-Requested-With': 'XMLHttpRequest' },
      });
      if (!resp.ok) return;
      container.innerHTML = await resp.text();
    }

    document.querySelectorAll('[data-home-notes]').forEach((container) => {
      container.addEventListener('click', async (e) => {
        const tab = e.target.closest('.home-notes-tab');
        if (!tab) return;
        e.preventDefault();

        const url = tab.getAttribute('href');
        const daily = document.getElementById('daily-note-container');
        const weekly = document.getElementById('weekly-notes-container');
        try {
          if (daily) await refreshNotes(daily, url, 'daily');
          if (weekly) await refreshNotes(weekly, url, 'weekly');
        } catch (err) {
          return;
        }
        window.history.pushState({}, '', url);
      });
    });

    window.addEventListener('popstate', () => {
      window.location.reload();
    });
  })();
</script>
