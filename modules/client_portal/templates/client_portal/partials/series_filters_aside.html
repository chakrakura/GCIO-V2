<aside class="w-full md:w-64 shrink-0 space-y-4">
  <input type="hidden" name="cleared" value="1">
  <div class="flex items-center gap-2 text-sm font-bold text-blue-900 dark:text-blue-300 mb-1">
    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"/></svg>
    Filters
    {% if selected_formats or query %}
      <a href="{{ clear_url }}" class="ml-auto text-[12px] font-semibold text-gray-400 dark:text-gray-500 hover:text-blue-700 dark:hover:text-blue-400">Clear</a>
    {% endif %}
  </div>

  <details open class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-4">
    <summary class="text-[11px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest cursor-pointer select-none">Report format</summary>
    <div class="mt-3 space-y-1">
      {% for f in format_filters %}
      <label class="flex items-center gap-2.5 text-[13.5px] text-gray-600 dark:text-gray-300 cursor-pointer rounded-lg px-2 py-1.5 -mx-2 transition-colors has-[:checked]:bg-blue-50 dark:has-[:checked]:bg-blue-900/20 has-[:checked]:text-blue-700 dark:has-[:checked]:text-blue-300 has-[:checked]:font-semibold">
        <input type="checkbox" name="format" value="{{ f.value }}" {% if f.value in selected_formats %}checked{% endif %} class="research-filter-input w-4 h-4 rounded accent-blue-600 shrink-0">
        <span class="flex-1">{{ f.label }}</span>
        <span class="text-xs text-gray-400 dark:text-gray-500">{{ f.count }}</span>
      </label>
      {% endfor %}
    </div>
  </details>
</aside>
