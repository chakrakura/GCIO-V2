{% extends "login/auth_base.html" %}

{% block title %}Password reset{% endblock %}

{% block auth_content %}
  <div class="w-12 h-12 rounded-full bg-green-50 dark:bg-green-900/20 text-green-700 dark:text-green-400 flex items-center justify-center mb-5">
    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <div class="text-[11px] tracking-wider font-bold text-gray-500 dark:text-gray-400 mb-2.5">RESET PASSWORD</div>
  <h2 class="font-serif font-bold text-[30px] text-blue-900 dark:text-blue-300 mb-2">Password updated</h2>
  <p class="text-sm text-gray-500 dark:text-gray-400 mb-7">Your password has been reset. You can now sign in with your new password.</p>

  <a class="w-full flex items-center justify-center gap-2 bg-blue-900 hover:bg-blue-950 text-white rounded-lg py-3.5 text-[15px] font-semibold" href="{% url 'login' %}">
    Sign in
  </a>
{% endblock %}
