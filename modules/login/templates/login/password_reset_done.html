{% extends "login/auth_base.html" %}

{% block title %}Check your email{% endblock %}

{% block auth_content %}
  <div class="w-12 h-12 rounded-full bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 flex items-center justify-center mb-5">
    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2Z"/><path d="m22 6-10 7L2 6"/></svg>
  </div>
  <div class="text-[11px] tracking-wider font-bold text-gray-500 dark:text-gray-400 mb-2.5">RESET PASSWORD</div>
  <h2 class="font-serif font-bold text-[30px] text-blue-900 dark:text-blue-300 mb-2">Check your email</h2>
  <p class="text-sm text-gray-500 dark:text-gray-400 mb-7">If an account exists for that email address, we've sent a link to reset your password. It'll expire in a few days.</p>

  <a class="w-full flex items-center justify-center gap-2 bg-blue-900 hover:bg-blue-950 text-white rounded-lg py-3.5 text-[15px] font-semibold" href="{% url 'login' %}">
    Back to sign in
  </a>
{% endblock %}
