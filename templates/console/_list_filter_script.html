{# Shared list-page filter drawer + custom dropdown helpers #}
<script>
  window.ConsoleFilterUI = (function () {
    var CHECKBOX_UNCHECKED = '<span class="report-dd-box inline-flex items-center justify-center w-4 h-4 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 shrink-0 transition-colors"></span>';
    var CHECKBOX_CHECKED = '<span class="report-dd-box inline-flex items-center justify-center w-4 h-4 rounded bg-blue-900 dark:bg-blue-600 text-white shrink-0 transition-colors"><svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="M20 6 9 17l-5-5"/></svg></span>';
    var openDropdownCloser = null;

    function getFocusable(container) {
      return Array.from(container.querySelectorAll(
        'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
      )).filter(function (el) {
        return el.offsetParent !== null || el === document.activeElement;
      });
    }

    function makeOption(text, selected, onPick) {
      var item = document.createElement('button');
      item.type = 'button';
      item.className = 'report-dd-option flex items-center gap-2.5 px-3 py-2 w-full text-left text-sm cursor-pointer rounded-lg transition-colors ' +
        (selected ? 'is-selected ' : '') +
        'text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700/70 hover:text-gray-900 dark:hover:text-white font-normal';
      item.setAttribute('role', 'option');
      item.setAttribute('aria-selected', selected ? 'true' : 'false');
      item.title = text;

      var boxHtml = selected ? CHECKBOX_CHECKED : CHECKBOX_UNCHECKED;
      item.insertAdjacentHTML('afterbegin', boxHtml);

      var label = document.createElement('span');
      label.className = 'truncate flex-1 pointer-events-none';
      label.textContent = text;
      item.appendChild(label);

      item.addEventListener('mousedown', function (e) {
        e.preventDefault();
        onPick();
      });
      return item;
    }

    function setActiveIndex(options, index) {
      options.forEach(function (el, i) {
        el.classList.toggle('is-active', i === index);
      });
      if (index >= 0 && options[index]) {
        options[index].scrollIntoView({ block: 'nearest' });
      }
    }

    function getSelectedValues(realSelect) {
      if (!realSelect) return [];
      return Array.from(realSelect.options)
        .filter(function (o) { return o.selected && o.value !== ''; })
        .map(function (o) { return o.value; });
    }

    function getSelectedTexts(realSelect) {
      if (!realSelect) return [];
      return Array.from(realSelect.options)
        .filter(function (o) { return o.selected && o.value !== ''; })
        .map(function (o) { return o.text; });
    }

    function setSelectedValues(realSelect, values) {
      if (!realSelect) return;
      var valSet = new Set(values);
      var noneOption = Array.from(realSelect.options).find(function (o) { return o.value === '__none__'; });
      if (valSet.has('__none__')) {
        if (!noneOption) {
          noneOption = document.createElement('option');
          noneOption.value = '__none__';
          noneOption.textContent = '__none__';
          realSelect.appendChild(noneOption);
        }
      }
      Array.from(realSelect.options).forEach(function (o) {
        if (o.value === '') {
          o.selected = (values.length === 0);
        } else {
          o.selected = valSet.has(o.value);
        }
      });
      realSelect.dispatchEvent(new Event('change', { bubbles: true }));
    }

    function initDrawer(opts) {
      var openBtn = document.getElementById(opts.openBtnId);
      var closeBtn = document.getElementById(opts.closeBtnId);
      var drawer = document.getElementById(opts.drawerId);
      var backdrop = document.getElementById(opts.backdropId);
      var badge = document.getElementById(opts.badgeId);
      var sr = document.getElementById(opts.srId);
      var lastFocus = null;

      function openDrawer() {
        lastFocus = document.activeElement;
        drawer.hidden = false;
        backdrop.setAttribute('aria-hidden', 'false');
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            drawer.classList.add('is-open');
            backdrop.classList.add('is-open');
          });
        });
        document.body.classList.add('console-filters-open');
        openBtn.setAttribute('aria-expanded', 'true');
        closeBtn.focus();
      }

      function closeDrawer() {
        if (typeof openDropdownCloser === 'function') openDropdownCloser();
        drawer.classList.remove('is-open');
        backdrop.classList.remove('is-open');
        backdrop.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('console-filters-open');
        openBtn.setAttribute('aria-expanded', 'false');
        setTimeout(function () {
          if (!drawer.classList.contains('is-open')) drawer.hidden = true;
        }, 200);
        if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
        else openBtn.focus();
      }

      openBtn.addEventListener('click', openDrawer);
      closeBtn.addEventListener('click', closeDrawer);
      backdrop.addEventListener('click', closeDrawer);

      document.addEventListener('keydown', function (e) {
        if (!drawer.classList.contains('is-open')) return;
        if (e.key === 'Escape') {
          e.preventDefault();
          if (typeof openDropdownCloser === 'function') {
            openDropdownCloser();
            return;
          }
          closeDrawer();
          return;
        }
        if (e.key === 'Tab') {
          var focusable = getFocusable(drawer);
          if (!focusable.length) return;
          var first = focusable[0];
          var last = focusable[focusable.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      });

      var count = opts.activeCount || 0;
      if (count > 0 && badge) {
        badge.textContent = String(count);
        badge.classList.add('is-visible');
        if (sr) sr.textContent = count + ' active filter' + (count === 1 ? '' : 's');
      }

      document.querySelectorAll('[data-remove-param]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var params = new URLSearchParams(window.location.search);
          params.delete(btn.getAttribute('data-remove-param'));
          params.delete('page');
          var qs = params.toString();
          window.location.href = window.location.pathname + (qs ? '?' + qs : '');
        });
      });
    }

    function initCustomSelect(wrapperId, realSelectId, triggerId, labelId, panelId, allLabel) {
      var wrapper = document.getElementById(wrapperId);
      if (!wrapper) return;
      var realSelect = document.getElementById(realSelectId);
      var trigger = document.getElementById(triggerId);
      var labelEl = document.getElementById(labelId);
      var panel = document.getElementById(panelId);
      if (!realSelect || !trigger || !labelEl || !panel) return;
      var validOptions = Array.from(realSelect.options).filter(function (o) { return o.value !== ''; });
      var activeIndex = -1;

      function syncTrigger() {
        var selectedTexts = getSelectedTexts(realSelect).filter(function (t) { return t !== '__none__'; });
        var selectedValues = getSelectedValues(realSelect);
        var noneSelected = selectedValues.indexOf('__none__') !== -1;
        var allSelected = !noneSelected && (selectedValues.length === 0 || selectedValues.length === validOptions.length);
        var isEmpty = allSelected || noneSelected || (selectedTexts.length === 0);

        var fullText = isEmpty ? allLabel : selectedTexts.join(', ');
        trigger.title = fullText;
        if (labelEl) labelEl.title = fullText;

        if (isEmpty) {
          labelEl.textContent = allLabel;
        } else if (selectedTexts.length === 1) {
          labelEl.textContent = selectedTexts[0];
        } else {
          labelEl.textContent = selectedTexts.length + ' selected (' + selectedTexts.join(', ') + ')';
        }
        labelEl.classList.toggle('text-gray-400', isEmpty);
        labelEl.classList.toggle('dark:text-gray-500', isEmpty);
        labelEl.classList.toggle('font-normal', isEmpty);
        trigger.classList.toggle('has-value', !isEmpty);
      }

      function close() {
        panel.classList.add('hidden');
        trigger.classList.remove('is-open');
        trigger.setAttribute('aria-expanded', 'false');
        if (openDropdownCloser === close) openDropdownCloser = null;
      }

      function open() {
        if (typeof openDropdownCloser === 'function' && openDropdownCloser !== close) openDropdownCloser();
        render();
        panel.classList.remove('hidden');
        trigger.classList.add('is-open');
        trigger.setAttribute('aria-expanded', 'true');
        openDropdownCloser = close;
        activeIndex = Math.max(0, Array.from(panel.querySelectorAll('[role="option"]')).findIndex(function (el) {
          return el.getAttribute('aria-selected') === 'true';
        }));
        setActiveIndex(Array.from(panel.querySelectorAll('[role="option"]')), activeIndex);
      }

      function render() {
        panel.innerHTML = '';
        var selectedValues = new Set(getSelectedValues(realSelect));
        var noneSelected = selectedValues.has('__none__');
        var allSelected = !noneSelected && (selectedValues.size === 0 || selectedValues.size === validOptions.length);

        panel.appendChild(makeOption(allLabel, allSelected, function () {
          if (allSelected) {
            setSelectedValues(realSelect, ['__none__']);
          } else {
            setSelectedValues(realSelect, []);
          }
          syncTrigger();
          render();
        }));

        validOptions.forEach(function (o) {
          var selected = !noneSelected && (allSelected || selectedValues.has(o.value));
          panel.appendChild(makeOption(o.text, selected, function () {
            var newValues = [];
            if (allSelected) {
              validOptions.forEach(function (other) {
                if (other.value !== o.value) newValues.push(other.value);
              });
            } else if (noneSelected) {
              newValues = [o.value];
            } else {
              var current = new Set(selectedValues);
              if (current.has(o.value)) current.delete(o.value);
              else current.add(o.value);
              newValues = Array.from(current);
            }

            if (newValues.length === validOptions.length) {
              setSelectedValues(realSelect, []);
            } else if (newValues.length === 0) {
              setSelectedValues(realSelect, ['__none__']);
            } else {
              setSelectedValues(realSelect, newValues);
            }
            syncTrigger();
            render();
          }));
        });
      }

      trigger.addEventListener('click', function () {
        if (panel.classList.contains('hidden')) open();
        else close();
      });

      trigger.addEventListener('keydown', function (e) {
        var opts = Array.from(panel.querySelectorAll('[role="option"]'));
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          if (panel.classList.contains('hidden')) {
            open();
            opts = Array.from(panel.querySelectorAll('[role="option"]'));
          }
          if (!opts.length) return;
          if (e.key === 'ArrowDown') activeIndex = Math.min(opts.length - 1, activeIndex + 1);
          else activeIndex = Math.max(0, activeIndex <= 0 ? 0 : activeIndex - 1);
          setActiveIndex(opts, activeIndex);
        } else if (e.key === 'Enter' || e.key === ' ') {
          if (!panel.classList.contains('hidden') && activeIndex >= 0 && opts[activeIndex]) {
            e.preventDefault();
            opts[activeIndex].dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
          } else if (panel.classList.contains('hidden') && e.key === ' ') {
            e.preventDefault();
            open();
          }
        } else if (e.key === 'Escape' && !panel.classList.contains('hidden')) {
          e.preventDefault();
          e.stopPropagation();
          close();
        }
      });

      document.addEventListener('click', function (e) {
        if (!wrapper.contains(e.target)) close();
      });

      syncTrigger();
    }

    function initFilterCombobox(wrapperId, realSelectId, searchInputId, panelId, allLabel) {
      var wrapper = document.getElementById(wrapperId);
      if (!wrapper) return;
      var realSelect = document.getElementById(realSelectId);
      var searchInput = document.getElementById(searchInputId);
      var panel = document.getElementById(panelId);
      if (!realSelect || !searchInput || !panel) return;
      var options = Array.from(realSelect.options).filter(function (o) { return o.value !== ''; });
      var activeIndex = -1;
      var currentQuery = '';

      function setExpanded(open) {
        searchInput.setAttribute('aria-expanded', open ? 'true' : 'false');
        searchInput.classList.toggle('is-open', open);
        var selectedTexts = getSelectedTexts(realSelect).filter(function (t) { return t !== '__none__'; });
        searchInput.classList.toggle('has-value', selectedTexts.length > 0);
      }

      function syncInputSummary() {
        var selectedTexts = getSelectedTexts(realSelect).filter(function (t) { return t !== '__none__'; });
        var selectedValues = getSelectedValues(realSelect);
        var noneSelected = selectedValues.indexOf('__none__') !== -1;
        var allSelected = !noneSelected && (selectedValues.length === 0 || selectedValues.length === options.length);
        var isEmpty = allSelected || noneSelected || (selectedTexts.length === 0);

        var fullText = isEmpty ? allLabel : selectedTexts.join(', ');
        searchInput.title = fullText;

        if (isEmpty) {
          searchInput.value = '';
          searchInput.placeholder = allLabel;
          searchInput.classList.remove('has-value');
        } else if (selectedTexts.length === 1) {
          searchInput.value = '';
          searchInput.placeholder = selectedTexts[0];
          searchInput.classList.add('has-value');
        } else {
          searchInput.value = '';
          searchInput.placeholder = selectedTexts.length + ' selected (' + selectedTexts.join(', ') + ')';
          searchInput.classList.add('has-value');
        }
      }

      function close() {
        panel.classList.add('hidden');
        setExpanded(false);
        if (openDropdownCloser === close) openDropdownCloser = null;
        currentQuery = '';
        syncInputSummary();
      }

      function renderOptions(filterQuery) {
        if (typeof openDropdownCloser === 'function' && openDropdownCloser !== close) openDropdownCloser();
        openDropdownCloser = close;

        var q = (filterQuery || '').trim().toLowerCase();
        var matches = options.filter(function (o) { return o.text.toLowerCase().includes(q); });
        panel.innerHTML = '';

        var selectedValues = new Set(getSelectedValues(realSelect));
        var noneSelected = selectedValues.has('__none__');
        var allSelected = !noneSelected && (selectedValues.size === 0 || selectedValues.size === options.length);

        panel.appendChild(makeOption(allLabel, allSelected, function () {
          if (allSelected) {
            setSelectedValues(realSelect, ['__none__']);
          } else {
            setSelectedValues(realSelect, []);
          }
          syncInputSummary();
          renderOptions(currentQuery);
        }));

        if (!matches.length) {
          var empty = document.createElement('div');
          empty.className = 'report-dd-empty text-xs text-gray-400 p-3 italic text-center';
          empty.textContent = 'No matching options';
          panel.appendChild(empty);
        } else {
          matches.forEach(function (o) {
            var selected = !noneSelected && (allSelected || selectedValues.has(o.value));
            panel.appendChild(makeOption(o.text, selected, function () {
              var newValues = [];
              if (allSelected) {
                options.forEach(function (other) {
                  if (other.value !== o.value) newValues.push(other.value);
                });
              } else if (noneSelected) {
                newValues = [o.value];
              } else {
                var current = new Set(selectedValues);
                if (current.has(o.value)) current.delete(o.value);
                else current.add(o.value);
                newValues = Array.from(current);
              }

              if (newValues.length === options.length) {
                setSelectedValues(realSelect, []);
              } else if (newValues.length === 0) {
                setSelectedValues(realSelect, ['__none__']);
              } else {
                setSelectedValues(realSelect, newValues);
              }
              syncInputSummary();
              renderOptions(currentQuery);
            }));
          });
        }

        panel.classList.remove('hidden');
        setExpanded(true);

        var opts = Array.from(panel.querySelectorAll('[role="option"]'));
        activeIndex = Math.max(0, opts.findIndex(function (el) {
          return el.getAttribute('aria-selected') === 'true';
        }));
        setActiveIndex(opts, activeIndex);
      }

      searchInput.addEventListener('focus', function () {
        searchInput.value = currentQuery;
        renderOptions(currentQuery);
      });
      searchInput.addEventListener('input', function () {
        currentQuery = searchInput.value;
        renderOptions(currentQuery);
      });
      searchInput.addEventListener('keydown', function (e) {
        var opts = Array.from(panel.querySelectorAll('[role="option"]'));
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          if (panel.classList.contains('hidden')) renderOptions(currentQuery);
          opts = Array.from(panel.querySelectorAll('[role="option"]'));
          if (!opts.length) return;
          if (e.key === 'ArrowDown') activeIndex = Math.min(opts.length - 1, activeIndex + 1);
          else activeIndex = Math.max(0, activeIndex <= 0 ? 0 : activeIndex - 1);
          setActiveIndex(opts, activeIndex);
        } else if (e.key === 'Enter') {
          if (!panel.classList.contains('hidden') && activeIndex >= 0 && opts[activeIndex]) {
            e.preventDefault();
            opts[activeIndex].dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
          }
        } else if (e.key === 'Escape' && !panel.classList.contains('hidden')) {
          e.preventDefault();
          e.stopPropagation();
          close();
          searchInput.blur();
        }
      });
      searchInput.addEventListener('blur', function () {
        setTimeout(function () {
          panel.classList.add('hidden');
          setExpanded(false);
          if (openDropdownCloser === close) openDropdownCloser = null;
          syncInputSummary();
        }, 150);
      });
      document.addEventListener('click', function (e) {
        if (!wrapper.contains(e.target)) close();
      });

      syncInputSummary();
    }

    return {
      initDrawer: initDrawer,
      initCustomSelect: initCustomSelect,
      initFilterCombobox: initFilterCombobox
    };
  })();
</script>
