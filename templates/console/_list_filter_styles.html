{# Shared list-page filter drawer styles (Reports / Users / Organisations) #}
<style>

    --report-brand: #1e3a8a;
    --report-brand-hover: #172554;
    --report-brand-ring: rgba(30, 58, 138, 0.22);
  }

  @media (prefers-reduced-motion: reduce) {

    .console-filter-backdrop,
    .report-dd-panel,
    .console-filters-btn,
    .report-dd-option,
    .report-dd-trigger,
    .report-filter-chip {
      transition: none !important;
      transform: none !important;
    }
  }

  .console-filter-drawer.is-open {
    transform: translateX(0);
  }
  .console-filter-backdrop.is-open {
    opacity: 1;
    pointer-events: auto;
  }
  body.console-filters-open {
    overflow: hidden;
  }

  .console-filters-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    height: 2.5rem;

    background: #1f2937;
    color: #e5e7eb;

    color: #fff;
    box-shadow: 0 2px 8px rgba(30, 58, 138, 0.28);
  }
  .console-filters-btn.is-active:hover {
    background: var(--report-brand-hover);
    border-color: var(--report-brand-hover);
    color: #fff;
    transform: translateY(-1px);
  }
  .console-filters-btn.is-active:focus-visible {
    box-shadow: 0 0 0 3px var(--report-brand-ring), 0 2px 8px rgba(30, 58, 138, 0.28);

    height: 1rem;
    flex-shrink: 0;

    line-height: 1;

    display: inline-flex;
  }

    background: var(--report-brand);
    color: #fff;
  }

    justify-content: space-between;

    color: #fff;

  }

    width: 1rem;
    height: 1rem;
    color: #fff;
    opacity: 0;

    border: 1px solid #e5e7eb;

    background: #1f2937;
    box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.5);

    padding: 0.75rem 0.875rem;
    font-size: 0.8125rem;
    color: #9ca3af;
  }
  .dark .report-dd-empty {
    color: #6b7280;
  }
  .report-dd-trigger {
    display: flex;
    align-items: center;
    width: 100%;
    height: 2.5rem;
    border: 1px solid #e5e7eb;
    border-radius: 0.5rem;
    background: #fff;
    color: #111827;
    font-size: 0.8125rem;
    transition: border-color 150ms ease, box-shadow 150ms ease, background-color 150ms ease;
  }
  .dark .report-dd-trigger {
    border-color: #374151;
    background: #1f2937;
    color: #f3f4f6;
  }

    border-color: #cbd5e1;

    border-color: #4b5563;
  }

    border-color: var(--report-brand);
    box-shadow: 0 0 0 3px var(--report-brand-ring);

    box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.45);

    font-weight: 600;
    letter-spacing: 0.01em;

  }

  }

  .report-filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    max-width: 100%;
    height: 2rem;
    padding: 0 0.375rem 0 0.625rem;
    border-radius: 0.5rem;
    border: 1px solid #c7d2fe;
    background: #eef2ff;
    color: #1e3a8a;
    font-size: 0.78125rem;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
  }

  .report-filter-chip:focus-visible {
    box-shadow: 0 0 0 3px var(--report-brand-ring);
  }
  .report-filter-chip-key {
    font-weight: 600;
    color: #312e81;
    flex-shrink: 0;
  }
  .dark .report-filter-chip-key {
    color: #bfdbfe;
  }
  .report-filter-chip-x {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.25rem;
    height: 1.25rem;
    border-radius: 0.375rem;
    color: #4338ca;
  }
  .dark .report-filter-chip-x {
    color: #93c5fd;
  }
  .report-filter-chip:hover .report-filter-chip-x {
    background: rgba(30, 58, 138, 0.12);
    color: var(--report-brand);
  }
</style>
