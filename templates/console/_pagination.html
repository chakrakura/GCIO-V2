{% if page_obj.paginator.num_pages > 1 %}
<div class="flex items-center justify-between px-5 py-3 border-t border-gray-200 dark:border-gray-700 flex-wrap gap-3">
  <div class="text-[12.5px] text-gray-500 dark:text-gray-400">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</div>
  <div class="flex gap-2">
    {% if page_obj.has_previous %}
      <a href="?{{ base_qs }}{% if base_qs %}&{% endif %}page={{ page_obj.previous_page_number }}" class="inline-flex items-center gap-1.5 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-700 rounded-lg px-3.5 py-1.5 text-[12.5px] font-semibold hover:bg-gray-50 dark:hover:bg-gray-700">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        Previous
      </a>
    {% else %}
      <span class="inline-flex items-center gap-1.5 bg-gray-50 dark:bg-gray-900 text-gray-300 dark:text-gray-600 border border-gray-200 dark:border-gray-700 rounded-lg px-3.5 py-1.5 text-[12.5px] font-semibold cursor-default">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        Previous
      </span>
    {% endif %}
    {% if page_obj.has_next %}
      <a href="?{{ base_qs }}{% if base_qs %}&{% endif %}page={{ page_obj.next_page_number }}" class="inline-flex items-center gap-1.5 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-700 rounded-lg px-3.5 py-1.5 text-[12.5px] font-semibold hover:bg-gray-50 dark:hover:bg-gray-700">
        Next
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    {% else %}
      <span class="inline-flex items-center gap-1.5 bg-gray-50 dark:bg-gray-900 text-gray-300 dark:text-gray-600 border border-gray-200 dark:border-gray-700 rounded-lg px-3.5 py-1.5 text-[12.5px] font-semibold cursor-default">
        Next
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </span>
    {% endif %}
  </div>
</div>
{% endif %}
